<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Munder Difflin</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:;" />
    <!-- Fonts are BUNDLED (src/renderer/src/design/fonts.css) rather than
         fetched from fonts.googleapis.com, which is blocked in mainland China.
         The CSP above no longer allows either Google font host.
         Fork perso: sober Orca-style chrome — Geist UI, SF Mono for code, dark
         by default (design/theme.ts), so the splash boots dark too. -->
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #0a0a0a; color: #fafafa;
        font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      #cth-splash .mk {
        display: grid; place-items: center; width: 48px; height: 48px;
        background: #262626; color: #fafafa; border-radius: 10px;
        font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 16px; font-weight: 600;
      }
      #cth-splash .title { font-size: 15px; font-weight: 600; }
      #cth-splash .hint { font-size: 13px; color: #a1a1a1; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk">MD</div>
        <div class="title">Munder Difflin</div>
        <div class="hint">booting the hive…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
